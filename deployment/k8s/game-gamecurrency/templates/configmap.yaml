apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamecurrency.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameCurrencySettings": {
        "GameProviderExchangeRates": [
            {
              "GameProviderCode": "AWC_PGS",
              "CurrencyCode": "IDR",
              "GameProviderCurrencyCode": "IDR",
              "ExchangeRate": 1000
            }
          ]
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
