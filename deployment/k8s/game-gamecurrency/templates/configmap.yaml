apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamecurrency.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Warning"
        }
      },
      "GameCurrencySettings": {
        "GameProviderExchangeRates": [
          {
            "GameProviderCode": "AWC_PGS",
            "CurrencyCode": "IDR",
            "GameProviderCurrencyCode": "IDR",
            "ExchangeRate": 1000
          },
          {
            "GameProviderCode": "AWC_PGS",
            "CurrencyCode": "VND",
            "GameProviderCurrencyCode": "VND",
            "ExchangeRate": 1000
          },
          {
            "GameProviderCode": "BTI",
            "CurrencyCode": "IDR",
            "GameProviderCurrencyCode": "IDR",
            "ExchangeRate": 1000
          },
          {
            "GameProviderCode": "SABATF",
            "CurrencyCode": "IDR",
            "GameProviderCurrencyCode": "15",
            "ExchangeRate": 1000
          },
          {
            "GameProviderCode": "SABATF",
            "CurrencyCode": "VND",
            "GameProviderCurrencyCode": "51",
            "ExchangeRate": 1000
          }
        ]
      }
    }
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:

    processors:
      batch:

    exporters:
      otlp:
        endpoint: "$NODE_IP:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "tgs"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces: 
          receivers: [otlp]
          processors:
            - batch
          exporters: [otlp]
        metrics:
          receivers: [otlp]
          exporters: [prometheus]